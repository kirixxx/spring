<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="./main.js"></script>
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header__wrapper">
                <a class="header__link" href="#">
                    <svg class="header__logo-icon" aria-hidden="true" width="324" height="63">
                        <use xlink:href="images/sprite.svg#spring-logo"></use>
                    </svg>
                </a>
                <ul class="header__nav-list"></ul>
                <div class="header__burger">
                    <div class="hamburger-react" aria-expanded="false" role="button" tabindex="0">
                        <div class="h-1"></div>
                        <div class="h-2"></div>
                        <div class="h-3"></div>
                    </div>
                </div>
            </div>
            <div class="nav-menu">
                <div class="nav-menu__wrapper">
                    <ul class="nav-menu__list"></ul>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="container">
                <div class="hero__wrapper">
                    <h1 class="hero__title">Projects</h1>
                    <p class="hero__text">From configuration to security, web apps to big data—whatever the
                        infrastructure needs of your application may be, there is a Spring Project to help you build it.
                        Start small and use just what you need—Spring is modular by design.</p>
                </div>
            </div>
        </section>
        <section class="technologies">
            <div class="container">
                <div class="technologies__wrapper">
                    <h2 class="visually-hidden">List of technologies</h2>
                    <div class="custom-input">
                        <input class="custom-input__field" type="text" placeholder="Micro..." aria-label="search-technologies" id="search-technologies" name="search-technologies">
                    </div>
                    <ul class="technologies__list"></ul>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
